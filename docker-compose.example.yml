version: '3.8'

services:
  web:
    build: .
    container_name: RLA-registro-de-limpeza-ames
    ports:
      - "8005:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=your_secret_key_here
      - DEBUG=False
      - DB_NAME=your_db_host:your_db_port/your_db_name
      - DB_USER=your_db_user
      - DB_PASSWORD=your_db_password
      - DJANGO_SUPERUSER_USERNAME=admin
      - DJANGO_SUPERUSER_EMAIL=your_email@example.com
      - DJANGO_SUPERUSER_PASSWORD=your_secure_password
    restart: unless-stopped

    networks:
      - rede_RLA
networks:
  rede_RLA:
    external: true
